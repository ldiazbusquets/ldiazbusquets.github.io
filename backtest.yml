# Runs the bot's year-to-date backtest on GitHub's servers and publishes the result to the site.
# Location in the repo:  .github/workflows/backtest.yml
name: Update backtest

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays at 22:30 UTC, after the U.S. market closes
  workflow_dispatch:           # also lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python backtest.py
      - name: Publish the result
        run: |
          git config user.name "backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtest.json
          git diff --cached --quiet || git commit -m "Update year-to-date backtest"
          git push
